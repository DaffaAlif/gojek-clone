version: '3.8'

# ── Shared env untuk semua Airflow services ───────────────────────────────────
x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: ride-hailing-airflow:latest
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: 'ZmRlZjEyMzQ1Njc4OTBhYmNkZWYxMjM0NTY3ODkwYWI='
    AIRFLOW__WEBSERVER__SECRET_KEY: 'ride-hailing-airflow-secret'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__LOGGING__LOGGING_LEVEL: 'INFO'
    # Koneksi ke Kafka (internal Docker network)
    KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
    # Supabase credentials (dibaca dari .env host)
    SUPABASE_HOST: '${SUPABASE_HOST}'
    SUPABASE_PORT: '${SUPABASE_PORT}'
    SUPABASE_USER: '${SUPABASE_USER}'
    SUPABASE_PASSWORD: '${SUPABASE_PASSWORD}'
    SUPABASE_DB: '${SUPABASE_DB}'
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  user: "0:0"
  networks:
    - ride_net
  depends_on:
    airflow-postgres:
      condition: service_healthy

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # PostgreSQL untuk Airflow metadata + ride history
  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ride_net

  # Inisialisasi DB + buat user admin + tambah koneksi PostgreSQL
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install confluent-kafka==2.3.0 psycopg2-binary==2.9.9 --quiet
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname Ride \
          --role Admin \
          --email admin@ridehailing.com \
          --password admin || true
        airflow connections add ride_data_supabase \
          --conn-type postgres \
          --conn-host "${SUPABASE_HOST}" \
          --conn-login "${SUPABASE_USER}" \
          --conn-password "${SUPABASE_PASSWORD}" \
          --conn-schema "${SUPABASE_DB}" \
          --conn-port "${SUPABASE_PORT}" || true
        echo "Airflow init selesai."
    restart: on-failure
    depends_on:
      airflow-postgres:
        condition: service_healthy

  # Webserver (UI Airflow)
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Scheduler (menjalankan DAG)
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

# ── Network & Volume ──────────────────────────────────────────────────────────
networks:
  ride_net:
    external: true
    name: ride_net

volumes:
  airflow_postgres_data:
